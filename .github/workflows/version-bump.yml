name: Version Bump

# Bumps package.json's patch version on every push to main (i.e. every
# merge), commits it back via a PR (main now requires PRs, even for this
# bot), and tags the result. Guarded against triggering itself in a loop
# two ways: [skip ci] in the bump commit's message (GitHub Actions itself
# won't start a new run for a commit containing it), and the `if:`
# condition below as a second line of defense.
on:
  push:
    branches:
      - main

jobs:
  bump-version:
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bump patch version
        id: bump
        run: |
          npm version patch --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Open and merge version-bump PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.bump.outputs.version }}"
          branch="version-bump/${version}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${version} [skip ci]"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore: bump version to ${version} [skip ci]" \
            --body "Automated patch version bump."
          gh pr merge "$branch" --squash --delete-branch \
            --subject "chore: bump version to ${version} [skip ci]"

      - name: Tag release
        run: |
          git fetch origin main
          git tag "v${{ steps.bump.outputs.version }}" origin/main
          git push origin "v${{ steps.bump.outputs.version }}"
