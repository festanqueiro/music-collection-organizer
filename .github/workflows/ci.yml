name: CI

# Type-check and tests on every pull request, on the same Apple-silicon
# macOS runner the Release workflow uses — some behaviour (FSEvents for
# the folder watcher, codesign, ffmpeg-static's binary) only shows up on
# macOS, and catching it here beats catching it at release time.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Test
        run: npm test
