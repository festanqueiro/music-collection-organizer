# Publishes MCO's Cast receiver page (cast-receiver/) to GitHub Pages, at
# the receiver URL registered for MCO's Cast application (see
# src/cast/receiverProtocol.ts).
#
# Runs on every push to main, not just changes under cast-receiver/: the
# page bundles code from all over the app (the effects chain and siren,
# default settings, the play-count rule, the threejs-visualisers package…),
# and a paths list kept missing some of it, leaving the TV on stale code.
# The version-bump commits are [skip ci], so they don't deploy again.
name: Deploy Cast receiver

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The receiver needs none of the desktop app's binaries.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run build:receiver
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
