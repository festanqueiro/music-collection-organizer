name: Website

# Publishes website/ (the marketing page, its screenshots and clips) to
# GitHub Pages whenever it changes on main. One-time setup: Settings →
# Pages → Source: GitHub Actions. The screenshots and clips are made with
# `npm run site:capture` (website/capture/README.md) and committed.
on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Leave the capture tooling out of the site
        run: rm -rf website/capture
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - id: deployment
        uses: actions/deploy-pages@v4
