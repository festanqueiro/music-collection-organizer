name: Release

# Builds the macOS installer (DMG, plus a ZIP of the .app) and attaches
# both to a GitHub release for the current package.json version. Run it by
# hand from the Actions tab ("Run workflow") after the version-bump
# workflow has tagged main — a tag pushed with the default GITHUB_TOKEN
# can't trigger other workflows, so this can't simply run "on: push: tags".
#
# The app is ad-hoc signed (package.json's mac.identity "-"), not signed
# with a paid Apple Developer ID or notarized. That's free and enough for
# macOS to run it, but the first launch on each Mac shows the "Apple could
# not verify…" warning and needs one "Open Anyway" in System Settings (see
# docs/features/releases-and-updates.md). An ad-hoc signature is what makes that button
# appear at all: a downloaded, completely unsigned Apple-silicon app is
# reported as "damaged" instead.
#
# The Windows installer (NSIS, x64, unsigned: SmartScreen warns once) is
# built on a Windows runner — ffmpeg-static downloads the ffmpeg for the OS
# that runs `npm ci` — and handed to the macOS job, which publishes it with
# the Mac files. "publish" off builds both and keeps them as workflow
# artifacts only (to try a branch without making a release).
on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub release as a draft (publish it by hand after checking)
        type: boolean
        default: false
      publish:
        description: Publish a GitHub release (off = build only, files kept as workflow artifacts)
        type: boolean
        default: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --noEmit

      - name: Build installer
        run: npm run dist:release:win

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error

  release:
    needs: windows
    runs-on: macos-14 # Apple silicon — the build is arm64-only (see docs/features/releases-and-updates.md)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: |
          npx tsc -b --noEmit
          npm test

      - name: Build installer
        run: npm run dist:release

      - name: Verify the ad-hoc signature
        run: |
          app=$(find release -maxdepth 2 -name "*.app" -print -quit)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -q "Signature=adhoc"

      - uses: actions/download-artifact@v8
        with:
          name: windows-installer
          path: release

      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.publish }}
        with:
          name: mac-installer
          path: |
            release/*.dmg
            release/*.zip

      - name: Create GitHub release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          draft=()
          [ "${{ inputs.draft }}" = "true" ] && draft=(--draft)
          gh release create "v${version}" release/*.dmg release/*.zip release/*.exe \
            --target "$GITHUB_SHA" \
            --title "MCO ${version}" \
            --notes-file docs/product/release-notes-install.md \
            --generate-notes \
            "${draft[@]}"
