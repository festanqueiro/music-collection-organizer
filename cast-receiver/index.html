<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MCO</title>
    <!-- Google's Cast receiver framework, for when the page runs on a Cast
         device; it also runs in a normal browser (see ?dev in main.ts). -->
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
      /* MCO's palette (src/theme.css). */
      :root {
        --bg: #12151a;
        --surface: #1b1f26;
        --border: #2b3140;
        --text: #e6e9ef;
        --dim: #9aa3b2;
        --accent: #2dd4bf;
      }
      html, body {
        margin: 0; height: 100%; overflow: hidden; color: var(--text);
        font-family: Roboto, system-ui, sans-serif;
        background: radial-gradient(circle at 30% 40%, var(--surface), var(--bg) 70%);
      }
      [hidden] { display: none !important; }
      #brand { position: fixed; top: 40px; right: 56px; display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 20px; }
      #brand img { width: 40px; height: 40px; border-radius: 50%; }
      #playing { position: fixed; inset: 0; display: flex; align-items: center; gap: 64px; padding: 0 120px; }
      .cover { width: 380px; height: 380px; flex-shrink: 0; border-radius: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5); }
      #artwork { object-fit: cover; }
      #placeholder { background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 120px; color: var(--border); }
      .details { min-width: 0; flex: 1; }
      #title { font-size: 48px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #artist { font-size: 30px; color: var(--dim); margin-top: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .track { height: 6px; background: var(--border); border-radius: 3px; margin-top: 48px; overflow: hidden; }
      #bar { height: 100%; width: 0; background: var(--accent); transition: width 250ms linear; }
      .meta { display: flex; justify-content: space-between; margin-top: 14px; font-size: 20px; color: var(--dim); font-variant-numeric: tabular-nums; }
      #waiting { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      #waiting .logo { position: relative; width: 150px; height: 150px; }
      #waiting .logo img { width: 100%; height: 100%; border-radius: 50%; }
      #waiting .logo::after {
        content: ''; position: absolute; inset: -8px; border: 3px solid var(--accent); border-radius: 50%;
        animation: pulse 2.4s ease-out infinite;
      }
      @keyframes pulse { from { transform: scale(1); opacity: 0.6; } to { transform: scale(1.35); opacity: 0; } }
      #waiting .headline { font-size: 40px; font-weight: 500; margin-top: 24px; }
      #waiting .sub { font-size: 22px; color: var(--dim); }
      #waiting .rule { width: 80px; height: 3px; background: var(--accent); margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="brand"><img id="logo" alt="" />MCO</div>
    <div id="waiting">
      <div class="logo"><img id="waiting-logo" alt="MCO" /></div>
      <div class="headline">Load a song to continue</div>
      <div class="sub">MCO is connected — play a track and it will show up here.</div>
      <div class="rule"></div>
    </div>
    <div id="playing" hidden>
      <img id="artwork" class="cover" alt="" hidden />
      <div id="placeholder" class="cover">♪</div>
      <div class="details">
        <div id="title"></div>
        <div id="artist"></div>
        <div class="track"><div id="bar"></div></div>
        <div class="meta"><span id="time"></span><span id="state"></span></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
